[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-triage-kit"
version = "0.1.0b1"
description = "Beta: a read-only triage snapshot for GitHub issues and pull requests."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Repo Triage Kit contributors" }]
keywords = ["github", "open-source", "maintainers", "triage", "pull-requests"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Bug Tracking",
]
dependencies = []

[project.scripts]
repo-triage = "repotriage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
